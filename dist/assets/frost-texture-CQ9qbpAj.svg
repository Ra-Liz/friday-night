<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 占位霜花纹理：配合径向 mask 用于"冰从边缘蔓延"效果 -->
  <defs>
    <filter id="edgefrost">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="42" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0 1.00
                0.7 0.7 0.7 0 -0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#dff2ff" filter="url(#edgefrost)"/>
  <!-- 枝状冰晶 -->
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M0 60 L80 100 L60 140 L150 180"/>
    <path d="M0 260 L60 240 L110 290 L200 270"/>
    <path d="M0 470 L90 430 L180 470 L280 420"/>
    <path d="M512 80 L430 120 L470 170 L380 210"/>
    <path d="M512 300 L440 280 L400 330 L310 310"/>
    <path d="M512 500 L420 460 L330 500 L240 450"/>
  </g>
</svg>
