<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 占位冰面纹理：feTurbulence 程序化霜纹，替换时直接覆盖本文件 -->
  <defs>
    <filter id="frost">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.78
                0 0 0 0 0.90
                0 0 0 0 1.00
                0.55 0.55 0.55 0 -0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#9fd4f5" filter="url(#frost)"/>
  <!-- 冰面反光裂纹 -->
  <g stroke="#dff2ff" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M0 400 L120 300 L200 330 L320 220 L512 260"/>
    <path d="M0 120 L90 160 L210 90 L340 150 L512 60"/>
    <path d="M40 512 L140 420 L260 460 L420 360 L512 400"/>
  </g>
</svg>
