<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>FridayNight 解冻倒计时</title>
  <meta name="description" content="周五 19:00，FridayNight 解冻开唱！工作日解冻倒计时，周末逐步上冻。" />
  <meta property="og:title" content="FridayNight 解冻倒计时" />
  <meta property="og:description" content="周五 19:00 解冻开唱，周末再上冻。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>" />
  <script type="module" crossorigin src="./assets/index-Coq_kdxi.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CRlpMBOv.css">
</head>
<body>
  <noscript>
    <p style="color:#cfeaff;text-align:center;padding:2rem">请开启 JavaScript 查看解冻倒计时。</p>
  </noscript>

  <main class="stage" id="stage" data-state="S1" data-stage="L0">
    <header class="title">
      <h1>FRIDAY&nbsp;NIGHT</h1>
      <p class="subtitle" id="subtitle">解冻倒计时</p>
    </header>

    <section class="visual" aria-label="主视觉">
      <!-- 主人公图片层（S1 主视觉） -->
      <div class="hero">
        <img src="./assets/hero-DlHl6Wv9.jpg" alt="FridayNight 主人公" />
      </div>

      <!-- 解冻特效层（S1：冰封随 --p 消退） -->
      <div class="ice-overlay">
        <div class="ice-texture"></div>
        <!-- 磨砂冰玻璃：隔着“一层冰”的质感，随 --p 融化消退 -->
        <div class="frost-glass"></div>
          <div class="ice-tint"></div>
          <!-- 多级分叉裂纹：seam=宽冰缝 line=亮裂线 branch=分支 -->
          <svg class="cracks" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g class="crack" style="--i:0">
          <path class="seam" d="M50 6 L47 22 L53 34 L49 48" />
        <path class="line" d="M50 6 L47 22 L53 34 L49 48" />
        <path class="line branch" d="M49 48 L44 58 L46 70" />
          </g>
        <g class="crack" style="--i:1">
              <path class="seam" d="M24 10 L30 26 L27 40 L33 54" />
              <path class="line" d="M24 10 L30 26 L27 40 L33 54" />
              <path class="line branch" d="M27 40 L20 48 L22 58" />
            </g>
            <g class="crack" style="--i:2">
              <path class="seam" d="M76 12 L70 28 L75 42 L70 56" />
              <path class="line" d="M76 12 L70 28 L75 42 L70 56" />
              <path class="line branch" d="M75 42 L82 50 L80 62" />
            </g>
            <g class="crack" style="--i:3">
              <path class="seam" d="M42 46 L50 62 L46 78 L52 92" />
              <path class="line" d="M42 46 L50 62 L46 78 L52 92" />
            </g>
            <g class="crack" style="--i:4">
              <path class="seam" d="M22 50 L32 64 L28 78" />
              <path class="line" d="M22 50 L32 64 L28 78" />
            </g>
            <g class="crack" style="--i:5">
              <path class="seam" d="M78 48 L68 62 L74 76" />
              <path class="line" d="M78 48 L68 62 L74 76" />
            </g>
            <g class="crack" style="--i:6">
              <path class="seam" d="M30 88 L44 84 L58 86 L72 82" />
              <path class="line" d="M30 88 L44 84 L58 86 L72 82" />
            </g>
          </svg>
          <!-- 融水滴落（L1/L2） -->
          <div class="drips" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
          <!-- 融水溪流：从裂缝向下蔓延的水痕（L2/L3） -->
          <div class="melt-streaks" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
        <div class="shards" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <!-- L4 蓄力发光层 -->
      <div class="aura" aria-hidden="true"></div>

      <!-- 视频层（S2/S3 主视觉） -->
      <video id="video" class="video" muted playsinline loop preload="none" poster="./assets/poster-DHnrGIre.jpg"></video>

      <!-- 上冻特效层（S3：随 --pf 增强） -->
      <div class="freeze-overlay" aria-hidden="true">
        <div class="freeze-veil"></div>
        <div class="frost"></div>
        <div class="freeze-ice"></div>
      </div>

      <!-- 视频加载失败兜底（SRS E-5） -->
      <div class="video-fallback" id="videoFallback" hidden>
        <img src="./assets/poster-DHnrGIre.jpg" alt="视频加载失败" />
        <button id="retryBtn" type="button">🔄 重试</button>
      </div>

      <!-- 自动播放被拦截兜底（SRS E-6） -->
      <div class="start-mask" id="startMask" hidden>
        <button id="startBtn" type="button">▶ 点击开始</button>
      </div>
      <!-- 视频进度条（S2/S3：可拖拽选择播放进度，FR-05-1b） -->
      <div class="seekbar" id="seekbar" aria-label="视频进度条" title="拖拽选择播放进度">
        <div class="seek-track"><div class="seek-fill" id="seekFill"></div></div>
      </div>
      <button id="unmuteBtn" class="unmute" type="button" hidden>🔇 取消静音</button>
      <!-- 沉浸式切换（FR-05-3 v1.3：窄视口 contain 完整展示 ↔ cover 铺满） -->
      <button id="immersiveBtn" class="immersive-toggle" type="button"
              aria-label="切换沉浸式铺满" aria-pressed="false"
              title="沉浸式铺满 / 完整展示">
        <svg class="ic-expand" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="ic-compress" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>

    <footer class="hud">
      <div class="countdown" id="countdown">--天 --:--:--</div>
      <div class="progress-line" id="progressLabel">解冻进度 0%</div>
    </footer>
  </main>

  <script>
    // 首帧防闪：提前按状态机规则打标（与 stateMachine.js 同一算法，改动需同步）
    (function () {
      var d = new Date(); d.setHours(0, 0, 0, 0);
      var H = 36e5, mon = d.getTime() - ((d.getDay() + 6) % 7) * 864e5, t = Date.now();
      var s, p;
      if (t < mon + 115 * H) { s = 'S1'; p = (t - mon) / (115 * H); }
      else if (t < mon + 120 * H) { s = 'S2'; p = 1; }
      else { s = 'S3'; p = (t - mon - 120 * H) / (48 * H); }
      var g = s === 'S1' ? (p < .15 ? 'L0' : p < .4 ? 'L1' : p < .7 ? 'L2' : p < .95 ? 'L3' : 'L4')
             : s === 'S3' ? (p < .3 ? 'F0' : p < .7 ? 'F1' : 'F2') : null;
      var st = document.getElementById('stage');
      st.dataset.state = s;
      if (g) st.dataset.stage = g; else st.removeAttribute('data-stage');
      st.style.setProperty('--p', (s === 'S1' ? p : 1).toFixed(4));
      st.style.setProperty('--pf', (s === 'S3' ? p : 0).toFixed(4));
    })();
  </script>
</body>
</html>
